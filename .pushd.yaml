# pushd build config — replaces Codemagic (see codemagic.yaml for prior art).
# Native Flutter Android app in mobile/, signed release APK + AAB, emailed.
#
# Trigger convention (handled by the pushd webhook, not this file):
#   v*         -> `android-release` is the one that matters (signed APK, emailed)
#   release-v* -> `android-publish` also runs (signed AAB -> Play internal, draft)
# Correction, verified against the running control plane: pushd does NOT filter
# by tag. It enqueues EVERY entry below on EVERY push webhook and skips only
# non-docker executors and Play-publish steps on a non-publish ref, so
# `android-release` and `verify` both run on plain branch pushes too.
#
# `verify` (last entry) is this repo's CI: GitHub Actions is failing before it
# executes a step, so pushd is the working verification plane. See that entry's
# comment block for triggers, status reporting, and blocking vs report-only.
#
# Signing secrets are provisioned per-project in pushd's secret store (never in
# this repo). mobile/android/app/build.gradle reads them as CM_* env vars:
#   CM_KEYSTORE_BASE64  base64 of fonto-upload.jks
#   CM_STORE_PASSWORD   keystore store password
#   CM_KEY_ALIAS        signing key alias
#   CM_KEY_PASSWORD     signing key password
# Image: public cirruslabs Flutter (Flutter stable + Android SDK + JDK17),
# pullable without a custom build. Pin to a concrete tag once the joeybuilt
# builder image exists.
version: 1
builds:
  android-release:
    executor: docker
    type: android
    flavor: flutter
    image: ghcr.io/cirruslabs/flutter:stable
    secrets:
      - GITHUB_TOKEN
      - CM_KEYSTORE_BASE64
      - CM_STORE_PASSWORD
      - CM_KEY_ALIAS
      - CM_KEY_PASSWORD
    commands:
      - git clone --depth 1 --branch main https://x-access-token:$GITHUB_TOKEN@github.com/joeybuilt-official/fonto.git .
      # The public cirruslabs flutter:stable image ships JDK 21 only; some
      # third-party plugins (e.g. photo_manager) compile Kotlin at 21 while the
      # app pins Java to 17 -> "Inconsistent JVM-target". Relax the check to a
      # warning so the release APK still builds (mixed 17/21 dex is runtime-safe
      # on minSdk 21). Remove once a pinned JDK17 builder image is used.
      - printf '\nkotlin.jvm.target.validation.mode=warning\n' >> mobile/android/gradle.properties
      - printf '%s' "$CM_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/fonto-upload.jks
      - cd mobile && flutter pub get
      # versionCode = unix seconds (monotonic, < the 2.1e9 int ceiling) so every
      # Pushd build outranks any prior install and updates in place. Was unset
      # -> fell back to pubspec 0.1.0+1 (versionCode 1), which Android refused to
      # install over higher-numbered legacy Codemagic builds.
      - cd mobile && CM_KEYSTORE_PATH=/tmp/fonto-upload.jks flutter build apk --release --build-name=0.2.1 --build-number=$(date +%s)
    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-release.apk
    deliver:
      - email
  android-publish:
    executor: docker
    type: android
    flavor: flutter
    image: ghcr.io/cirruslabs/flutter:stable
    secrets:
      - GITHUB_TOKEN
      - CM_KEYSTORE_BASE64
      - CM_STORE_PASSWORD
      - CM_KEY_ALIAS
      - CM_KEY_PASSWORD
      - GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    commands:
      - git clone --depth 1 --branch main https://x-access-token:$GITHUB_TOKEN@github.com/joeybuilt-official/fonto.git .
      - printf '\nkotlin.jvm.target.validation.mode=warning\n' >> mobile/android/gradle.properties
      - printf '%s' "$CM_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/fonto-upload.jks
      - cd mobile && flutter pub get
      # versionCode = unix seconds (monotonic, < the 2.1e9 int ceiling) so every
      # Pushd build outranks any prior install and updates in place. Was unset
      # -> fell back to pubspec 0.1.0+1 (versionCode 1), which Android refused to
      # install over higher-numbered legacy Codemagic builds.
      - cd mobile && CM_KEYSTORE_PATH=/tmp/fonto-upload.jks flutter build apk --release --build-name=0.2.1 --build-number=$(date +%s)
      - cd mobile && CM_KEYSTORE_PATH=/tmp/fonto-upload.jks flutter build appbundle --release --build-name=0.2.1 --build-number=$(date +%s)
    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-release.apk
      - mobile/build/app/outputs/bundle/release/app-release.aab
    deliver:
      - email
      - play:internal:draft
  # ---------------------------------------------------------------------------
  # CI verification. This is now the repo's WORKING CI plane:
  # .github/workflows/verify.yml (runs-on: ubuntu-latest) has failed on every run
  # for days — ~2 seconds, zero steps executed, including on main — which is a
  # GitHub Actions-side failure (billing/quota), not a code failure. That
  # workflow file is deliberately left in place so the two planes keep the same
  # command list if Actions is ever restored; until then it is dead weight and
  # pushd is the plane that actually runs.
  #
  # Trigger: pushd enqueues EVERY entry under `builds:` on every push webhook
  # (docs/pushd-yaml.md "On every push (GitHub webhook) ... one job per entry";
  # apps/build/src/http.ts iterates yaml.builds and skips only non-docker
  # executors and Play-publish steps). There is no per-entry trigger filter, so
  # this runs on branch pushes AND tag pushes. Pull-request events are not
  # accepted at all (the webhook payload schema requires push fields), but a PR
  # from a branch in this repo still gets gated: the branch push fires the build
  # and the commit status lands on the PR head SHA.
  #
  # Pass/fail is reported as the GitHub commit status `pushd/build` on the pushed
  # SHA. Two pushd-side caveats shape this entry:
  #   * every entry posts to that ONE status context, so the last job to finish
  #     wins. `verify` is deliberately the LAST entry in this file: with a single
  #     build worker the queue is FIFO, so it finishes after android-release and
  #     its verdict is the one GitHub keeps.
  #   * the build container receives no ref/SHA env (only declared secrets are
  #     injected), so the clone below is pinned to `main`. On a push to main that
  #     is the commit being reported on; on a feature-branch push this verifies
  #     main rather than the branch. Making it exact needs a pushd change:
  #     inject PUSHD_REF / PUSHD_COMMIT_SHA and clone that.
  #
  # A success status is only posted when a job stored at least one artifact, so
  # this build ends by writing report files.
  # verify: REMOVED 2026-08-30 — see docs/claude/platform/open-problems-2026-08-30.md
  #
  # A node:22 verify job (pnpm install + typecheck + lint + arch + vitest) was
  # added here to replace GitHub Actions, which has been failing on every run
  # for days (quota/billing). It exceeded pushd's 30-minute BUILD_TIMEOUT_MS and
  # exited 124 on every push.
  #
  # That was not merely noisy. pushd runs BUILD_CONCURRENCY=1, a single FIFO
  # worker, so each timing-out verify burned 30 minutes of the ONLY build slot
  # and starved the android-release builds the operator actually needs. It also
  # emailed a failure notice per push.
  #
  # To reinstate it, one of these has to change first:
  #   * give the runner a warm pnpm store (a cold install of this dep tree —
  #     sharp, onnxruntime — is most of the 30 minutes), or
  #   * raise BUILD_TIMEOUT_MS on service AND raise
  #     BUILD_CONCURRENCY above 1, so CI cannot starve releases, or
  #   * run verification somewhere that is not the release build queue.
  #
  # Until then the real pre-merge gate is local:
  #   pnpm typecheck && pnpm lint && pnpm arch && npx vitest run --dir lib
