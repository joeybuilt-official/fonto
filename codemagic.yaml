workflows:
  android-release:
    name: Android — build + test + bundle
    environment:
      flutter: stable
      groups:
        - android-signing
        # Phase 6.3 — holds GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (the Google
        # Play service-account JSON, with "Release manager" permission).
        # OPERATOR: create this group in Codemagic and add the var before the
        # first tagged build that should publish.
        - google-play
    # Tag-gated: a build fires ONLY when a `v*` tag is pushed (e.g.
    # `git tag v1.0.17 && git push origin v1.0.17`). Plain commits to main
    # — including mobile/** changes — no longer trigger builds, so
    # intermediate sub-phase pushes don't burn CI minutes. Cut a build
    # deliberately by tagging. See mobile/CI.md.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
        working_directory: mobile
      - name: Analyse
        script: flutter analyze
        working_directory: mobile
      - name: Widget tests
        script: flutter test --reporter=expanded
        working_directory: mobile
      - name: Build release APK + AAB
        script: |
          # Decode + build must share one shell — Codemagic does not persist
          # exported vars across script steps, and the gradle release config
          # falls back to debug signing when CM_KEYSTORE_PATH is unset.
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/fonto-upload.jks
          export CM_KEYSTORE_PATH=/tmp/fonto-upload.jks
          flutter build apk --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER
          flutter build appbundle --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER
        working_directory: mobile
    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-release.apk
      - mobile/build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
      # Phase 6.3 — push the signed AAB to the Play "internal" track as a
      # draft for manual review/rollout. Prerequisites (one-time, operator):
      #   1. Create the app listing in Play Console (package
      #      com.joeybuilt.fonto) and upload the FIRST AAB by hand — the
      #      Play Developer API can't create an app or opt into Play App
      #      Signing; it can only publish to an app that already exists.
      #   2. Create a GCP service account with the "Release manager" role,
      #      link it under Play Console → Users & permissions, download its
      #      JSON key, and add it to the Codemagic `google-play` group as
      #      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS.
      # After that, every `v*` tag auto-publishes a fresh draft.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
