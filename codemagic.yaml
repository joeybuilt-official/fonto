workflows:
  android-release:
    name: Android — build + test + bundle
    environment:
      flutter: stable
      groups:
        - android-signing
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
        working_directory: mobile
      - name: Analyse
        script: flutter analyze
        working_directory: mobile
      - name: Widget tests
        script: flutter test --reporter=expanded
        working_directory: mobile
      - name: Build release APK + AAB
        script: |
          # Decode + build must share one shell — Codemagic does not persist
          # exported vars across script steps, and the gradle release config
          # falls back to debug signing when CM_KEYSTORE_PATH is unset.
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/fonto-upload.jks
          export CM_KEYSTORE_PATH=/tmp/fonto-upload.jks
          flutter build apk --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER
          flutter build appbundle --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER
        working_directory: mobile
    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-release.apk
      - mobile/build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
