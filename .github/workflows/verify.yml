# NOTE: this workflow has failed on every run for days — ~2 seconds, zero steps
# executed, including on main — which is a GitHub Actions-side failure
# (billing/quota), not a code failure. The working CI plane is pushd: the
# `verify` build in /.pushd.yaml runs the same checks on the self-hosted
# runners and reports the `pushd/build` commit status. Kept here, unmodified,
# so Actions resumes gating the moment the account-side problem is fixed.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm arch
      - run: pnpm conformance
      - run: pnpm build
