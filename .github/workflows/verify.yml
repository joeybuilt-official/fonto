# Pre-merge gate. Runs on GitHub-hosted `ubuntu-latest`.
#
# INVARIANT: this job must stay on a GitHub-hosted runner. This repo is PUBLIC,
# so any fork can open a PR, and for a `pull_request` event GitHub takes the
# workflow file from the PR's *merge commit* — meaning the fork's code controls
# the job body below, including `runs-on` and every `run:` step. On an ephemeral
# hosted VM that is contained; on our self-hosted pool it is not, because the
# runner carrying the `docker` label runs as uid=0 with /var/run/docker.sock
# mounted rw, which is host-root-equivalent. Moving this workflow back to
# `[self-hosted, hive]` would hand an untrusted fork's shell to the host.
#
# Corollary: fork PRs receive no `secrets.*`, so this workflow must never grow
# a dependency on a secret or it will fail on every outside contribution.
#
# History: this workflow was disabled on 2026-08-30 because every run failed in
# ~2 seconds with zero steps executed — the org is on the GitHub Free plan and
# had burned its 2,000 included Actions minutes, so `ubuntu-latest` jobs were
# rejected before they started. It was then moved to `[self-hosted, hive]` to
# escape metered minutes.
#
# That reason is gone. The 2,000-minute allowance meters PRIVATE repos only; for
# public repos standard hosted runners are free and unlimited. The repo is public
# now, and hosted `ubuntu-latest` for public repos is 4 vCPU / 16 GB RAM — double
# the 8 GiB the hive runners are capped at — so the heap ceiling below has MORE
# headroom than it did on self-hosted, not less. See nexalog's verify.yml for the
# same pattern, proven green on PR events.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `next build` on this app exceeds Node's ~2 GB default heap and dies with
      # exit 134 ("Ineffective mark-compacts near heap limit"). 6 GiB was chosen
      # against the 8 GiB hive cap; on a 16 GB hosted runner it is comfortable.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      # No `version:` input — action-setup v4 reads `packageManager` from
      # package.json. Specifying BOTH is a hard error ("Multiple versions of
      # pnpm specified"), which is what killed every run after #2 added the pin.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The fleet-decoupling guard runs FIRST among the checks: it is pure Node,
      # zero-dependency, and fails fast on a re-introduced sibling dependency,
      # import, or PLEXO_* env read (see scripts/conformance-guard.mjs).
      - run: pnpm conformance
      - run: pnpm typecheck
      - run: pnpm lint
      # BENCH-10: the ratchet may never be raised above the module count at the PR's base commit,
      # so on a pull_request the gate gets the base ref and compares. `--depth=1` on the checkout
      # means `origin/<base>` usually has to be fetched first.
      #
      # `--require-base` is what makes that a check and not a suggestion. A failed fetch here used to
      # produce the gate's own SKIP line and exit 0 — loud in the log, invisible to branch
      # protection, which reads only the conclusion of the required `verify` context. The ratchet
      # would be switched off and the check painted green. Now the pull_request path fails when the
      # base ref cannot be obtained; the fetch keeps `|| true` so the failure arrives as the gate's
      # own named error rather than a bare shell exit. On a push there is no base, and `pnpm arch`
      # still skips the floor with a printed line, which is correct there.
      # The gate's own checks can rot the way it was built to catch: a "cleanup" that makes the
      # baseline-integrity assertions match nothing would leave a green gate over a dead baseline.
      # Ten cases, six expected to fail, run before the gate — the same shape as scan:infra's
      # --self-test step below.
      - run: pnpm arch:self-test
      - name: Architecture boundaries and baseline floor
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
            node scripts/check-architecture.mjs --base "origin/${{ github.base_ref }}" --require-base
          else
            pnpm arch
          fi
      # Tests run before the build: `pnpm test` is fast and gives a precise
      # failure, whereas a broken unit test would otherwise surface only as a
      # failed 6 GiB `next build` ~15 minutes later.
      - run: pnpm test
      # Guards with self-tests. `scan:infra` blocks committed production
      # hostnames / deploy paths / internal names; its --self-test plants a
      # canary per rule first, so a clean run cannot be a vacuous one.
      - run: pnpm scan:infra
      - run: bash scripts/scan-infra-identifiers.sh --self-test
      # Fails when .env.example drifts behind the variables the code reads.
      - run: pnpm check:env-example
      # The Panoply landing gates. They live here rather than in a pre-commit hook because
      # `--no-verify` skips a hook and a required status check cannot be skipped — and because
      # every one of them is a claim about the CHANGE, which only the base ref can answer.
      #
      # `panoply.sh check` certifies the kit itself. With no kit source reachable it prints a note and
      # judges the repo against the generation it carries, so it is green in CI (a clone) as well as on
      # a box that holds the kit.
      - name: Kit and docs gates
        run: |
          sh scripts/panoply.sh check
          sh scripts/sync-agents.sh --check
          sh scripts/check-conflict-markers.sh
          sh scripts/check-plan-home.sh
          BASE="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
          echo "docs gates: change since $BASE"
          sh scripts/check-docs.sh --since "$BASE"
          sh scripts/check-spec.sh --since "$BASE"
          sh scripts/check-algorithm.sh --since "$BASE"
          # check-comments judges COMMENT PROSE, and generated mirrors are copies of vendored kit text:
          # `.agents/rules/algorithm.mdc` carries the kit's own "Step 1 — Question" headings, which the
          # narration rule reads as slop. The gate has no path filter, so when the diff touches generated
          # or vendored kit text it is skipped HERE, visibly, and runs for every ordinary code change.
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(\.agents/rules/|\.cursor/rules/|\.clinerules/|\.windsurf/rules/|GEMINI\.md|CONVENTIONS\.md|AGENTS\.md|CLAUDE\.md|\.github/copilot-instructions\.md|scripts/panoply\.sh)'; then
            echo "check-comments: skipped — the change includes generated or vendored kit text (see docs/agents/governance/kit-migration/plan.md)"
          else
            sh scripts/check-comments.sh --since "$BASE"
          fi
      - run: pnpm build
