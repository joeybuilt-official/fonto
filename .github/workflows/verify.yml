# Pre-merge gate. Runs on the self-hosted `hive` runner pool, NOT on
# GitHub-hosted runners.
#
# History: this workflow was disabled on 2026-08-30 because every run failed in
# ~2 seconds with zero steps executed — the joeybuilt-official org is on the
# GitHub Free plan and had burned its 2,000 included Actions minutes, so
# `ubuntu-latest` jobs were rejected before they started ("recent account
# payments have failed or your spending limit needs to be increased"). That was
# a billing problem, not a code problem.
#
# Moving to `[self-hosted, hive]` takes this workflow off metered minutes
# entirely — self-hosted runners do not consume the included-minutes quota — so
# the push/pull_request triggers are restored here.
#
# Runner pool note: runner-pool are interchangeable for this job. Only
# runner-docker mounts a docker socket (it alone carries the extra `docker` label),
# so do NOT add a `services:` block or a `docker run` step to this workflow
# without also targeting that label — otherwise the job lands on a
# docker-less runner ~3 times in 4, at random.
name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, hive]
    timeout-minutes: 30
    env:
      # `next build` on this app exceeds Node's ~2 GB default heap and dies with
      # exit 134 ("Ineffective mark-compacts near heap limit"). The runners are
      # capped at 8 GiB, so 6 GiB is the headroom-preserving ceiling.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm arch
      - run: pnpm conformance
      # Tests run before the build: `pnpm test` is fast and gives a precise
      # failure, whereas a broken unit test would otherwise surface only as a
      # failed 6 GiB `next build` ~15 minutes later.
      - run: pnpm test
      # Guards with self-tests. `scan:infra` blocks committed production
      # hostnames / deploy paths / internal names; its --self-test plants a
      # canary per rule first, so a clean run cannot be a vacuous one.
      - run: pnpm scan:infra
      - run: bash scripts/scan-infra-identifiers.sh --self-test
      # Fails when .env.example drifts behind the variables the code reads.
      - run: pnpm check:env-example
      # NOTE: the docs landing gate (scripts/check-docs.sh) is deliberately NOT
      # wired in here. It requires CHANGELOG.md to change in every code commit,
      # and this repo has no history of maintaining one — enabling it would fail
      # the very next push instead of preventing a regression. CHANGELOG.md now
      # exists as the worklog target, so enabling this is a one-line change when
      # the maintainer wants it:
      #     - run: sh scripts/check-docs.sh --since HEAD~1
      - run: pnpm build
