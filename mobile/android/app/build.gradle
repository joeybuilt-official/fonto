plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.joeybuilt.fonto"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "com.joeybuilt.fonto"
        minSdk = 21
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        // App Links host for the AndroidManifest intent-filter placeholder
        // (${fontoAppLinkHost}). Injected at build time — precedence:
        //   1. -PfontoAppLinkHost=...        (gradle property)
        //   2. $FONTO_APP_LINK_HOST          (environment; what .pushd.yaml sets)
        //   3. "localhost"                   (default → App Links simply do not
        //                                     verify; the app still builds/runs)
        // There is deliberately NO production hostname in the public repo.
        def appLinkHost = (project.findProperty("fontoAppLinkHost")
                           ?: System.getenv("FONTO_APP_LINK_HOST")
                           ?: "localhost")
        manifestPlaceholders = [fontoAppLinkHost: appLinkHost]
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // flutter_local_notifications uses java.time APIs; desugaring is required
        // when minSdk < 26 (ours is 21) so they are available on older devices.
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
