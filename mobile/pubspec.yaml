name: fonto_mobile
description: Fonto mobile client — PAT-auth, asset browse, camera upload.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.0
  cached_network_image: ^3.4.0
  path: ^1.9.0
  photo_view: ^0.15.0
  share_plus: ^10.0.0
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  workmanager: ^0.9.0
  crypto: ^3.0.6
  convert: ^3.1.1
  app_links: ^6.3.0
  url_launcher: ^6.3.0
  flutter_doc_scanner: ^0.0.20
  google_sign_in: ^6.2.1
  photo_manager: ^3.3.0
  shared_preferences: ^2.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.0
  video_player: ^2.9.2
  flutter_foreground_task: ^9.2.2
  connectivity_plus: ^7.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Launcher icon config. Regenerate with: dart run flutter_launcher_icons
# Mipmaps + adaptive resources in android/app/src/main/res were generated
# manually (no Flutter SDK in the icon-authoring env); rerunning the tool is safe.
# Icon is the "_fonto" wordmark. For the adaptive icon the wordmark is baked
# into the BACKGROUND layer (icon-background) and the FOREGROUND is intentionally
# empty, so the launcher mask + foreground zoom never clip the text.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/icon-1024.png"
  adaptive_icon_background: "assets/branding/icon-background.png"
  adaptive_icon_foreground: "assets/branding/icon-foreground.png"
  min_sdk_android: 21
