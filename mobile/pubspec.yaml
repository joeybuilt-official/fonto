name: fonto_mobile
description: Fonto mobile client — PAT-auth, asset browse, camera upload.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.0
  cached_network_image: ^3.4.0
  path: ^1.9.0
  photo_view: ^0.15.0
  share_plus: ^10.0.0
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  workmanager: ^0.5.2
  crypto: ^3.0.6
  app_links: ^6.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
