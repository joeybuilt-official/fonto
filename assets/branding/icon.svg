<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!-- Fonto app icon. lowercase f monogram, single-weight stroke, on teal gradient. Brand teal 2AB0A5. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33C6B8"/>
      <stop offset="1" stop-color="#1C857C"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="104" stroke-linecap="round" stroke-linejoin="round">
    <!-- f: ascender hook into vertical stem -->
    <path d="M642 300
             a132 132 0 0 0 -132 132
             v332"/>
    <!-- crossbar -->
    <path d="M396 470 h300"/>
  </g>
